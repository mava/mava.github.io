<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Examples</title>
    <meta name="author" content="Marco Varisco">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0c0c0c">
    <link rel="icon" type="image/png" href="/images/%E2%88%87.png">
    <style>
      :root {
        --bg:            #0c0c0c;
        --surface:       #161616;
        --border:        #272727;
        --track:         #3a3a3a;
        --text:          #ece9e8;
        --muted:         #9c978e;
        --accent:        #ff2743;
        --accent-glow:   rgba(255, 39, 67, 0.1);
        --accent-border: rgba(255, 39, 67, 0.25);
        --accent-muted:  #d4778a;
        --beat:          350ms; /* read by JS; accepts either ms or s, bare number = ms   */
        --press-scale:   0.92;  /* :active press depth; 1 = no scale (see reduced-motion) */
        --radius:        3px;
        --font-ui:       system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-display:  ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        color-scheme:    dark;
      }

      @media (prefers-reduced-motion: reduce) {
        :root { --beat: 0ms; --press-scale: 1; }
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        min-height: 100vh; /* fallback */
        min-height: 100dvh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 3rem 1rem;
      }

      button { font: inherit; }

      strong { font-weight: 700; }

      ::selection {
        background: var(--accent-muted);
        color: var(--bg);
      }

      .app {
        width: 100%;
        max-width: 600px;
      }

      .noscript {
        margin: 0 0 1.25rem;
        padding: 1rem 1.25rem;
        background: var(--accent-glow);
        border: 1px solid var(--accent);
        border-radius: var(--radius);
        color: var(--text);
      }

      .tabs {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--track) transparent;
        scroll-snap-type: x proximity;
        gap: 1.75rem;
        margin-bottom: 1.25rem;
        box-shadow: inset 0 -1px 0 var(--border);
      }

      .tab {
        flex-shrink: 0;
        white-space: nowrap;
        scroll-snap-align: start;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 0.4rem 0 0.8rem;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        transition: color 0.2s ease, border-color 0.2s ease;
      }

      @media (hover: hover) {
        .tab:hover { color: var(--text); }
      }

      .tab:focus-visible {
        outline: 2px solid var(--accent-muted);
        outline-offset: -2px;
        color: var(--text);
      }

      .tab.is-active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      .example {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
      }

      .example-grid     { margin: 0 -1.5rem; }
      .example-grid > * { padding: 0 1.5rem; }

      /* divider between columns: a top rule when stacked, a left rule when side by side */
      .example-details {
        margin-top: 1.75rem;
        padding-top: 1.75rem;
        border-top: 1px solid var(--border);
      }

      @media (min-width: 992px) {
        .app { max-width: 1000px; }

        .example-grid {
          display: grid;
          grid-template-columns: 7fr 5fr;
        }

        .example-details {
          margin-top: 0;
          padding-top: 0;
          border-top: none;
          border-left: 1px solid var(--border);
        }
      }

      .example-title {
        font-size: 1rem;
        font-weight: 400; /* instead of bold on h1 */
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-wrap: balance;
        color: var(--accent);
        margin: 0 0 1.5rem;
      }

      .progress-track {
        display: flex;
        gap: 5px;
        margin-bottom: 2.25rem;
      }

      .progress-pip {
        flex: 1;
        height: 3px;
        background: var(--track);
        border-radius: 99px;
        transition: background-color var(--beat) ease;
      }

      .progress-pip.filled { background: var(--accent); }

      .progress-pip--summary {
        flex: 0 0 1.25rem;
        margin-left: 0.5rem;
      }

      .progress-pip--summary.filled { background: var(--accent-muted); }

      .year-button-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .year {
        font-family: var(--font-display);
        font-size: 3rem;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        line-height: 1;
        color: var(--text);
        margin: 0;
      }

      .stat-grid {
        display: grid;
        gap: 1rem;
      }

      @media (min-width: 576px) {
        .stat-grid { grid-template-columns: 1fr 1fr; }
      }

      .stat-card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem 1.5rem 1.4rem;
        container-type: inline-size;
      }

      .stat-label {
        font-size: 0.75rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }

      .stat-value {
        font-family: var(--font-display);
        font-size: clamp(1.6rem, 7vw, 2.5rem);   /* fallback */
        font-size: clamp(1.6rem, 18cqi, 2.5rem); /* sized to the card so 6-digit figures fit */
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        line-height: 1;
        color: var(--text);
        white-space: nowrap;
      }

      .stat-card--accent {
        background: var(--accent-glow);
        border-color: var(--accent-border);
      }

      .stat-card--accent .stat-value { color: var(--accent); }

      .details-log {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .details-log li {
        display: flex;
        align-items: baseline;
        gap: 0.9rem;
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--border);
      }

      .details-log li:last-child { border-bottom: none; }

      .log-year {
        flex: 0 0 3.5rem;
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        color: var(--accent);
        white-space: nowrap;
      }

      .log-text {
        flex: 1;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--muted);
        white-space: pre-line;
        transition: color var(--beat) ease;
      }

      .details-log li.current .log-text { color: var(--text); }

      .summary-box {
        margin-top: 1.75rem;
        padding: 1.5rem 1.5rem 1.6rem;
        background: var(--accent-glow);
        border: 1px solid var(--accent);
        border-radius: var(--radius);
      }

      .summary {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text);
        white-space: pre-line;
      }

      .subsummary {
        margin: 0.85rem 0 0;
        font-size: 0.85rem;
        line-height: 1.6;
        color: var(--muted);
        white-space: pre-line;
      }

      .action-btn {
        --btn-accent: var(--accent);
        display: inline-grid;
        justify-items: center;
        align-items: center;
        background: transparent;
        border: 1px solid var(--btn-accent);
        color: var(--btn-accent);
        font-size: 0.75rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        padding: 0.8rem 1.5rem;
        cursor: pointer;
        border-radius: var(--radius);
        transition-property: background, color, border-color, transform;
        transition-duration: 0.2s;
        transition-timing-function: ease;
        -webkit-tap-highlight-color: transparent;
        flex-shrink: 0;
      }

      .btn-label {
        grid-area: 1 / 1;
        white-space: nowrap;
        visibility: hidden;
      }

      .action-btn[data-state="advance"] .btn-label--advance,
      .action-btn[data-state="summary"] .btn-label--summary,
      .action-btn[data-state="reset"]   .btn-label--reset   { visibility: visible; }

      @media (hover: hover) {
        .action-btn:hover {
          background: var(--btn-accent);
          color: var(--bg);
        }
      }

      .action-btn:focus-visible {
        outline: 2px solid var(--accent-muted);
        outline-offset: 5px;
        background: var(--btn-accent);
        color: var(--bg);
      }

      .action-btn[data-state="summary"] { --btn-accent: var(--accent-muted); }
      .action-btn[data-state="reset"]   { --btn-accent: var(--muted); }

      .action-btn:active,
      .action-btn.is-pressed {
        background: var(--btn-accent);
        color: var(--bg);
        transform: scale(var(--press-scale));
        transition-duration: 0s; /* press registers immediately; release uses the base timing */
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        clip-path: inset(50%);
        overflow: hidden;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <noscript>
        <p class="noscript">This page won’t work without JavaScript.</p>
      </noscript>

      <div class="tabs" id="tabs" role="tablist" aria-label="Examples"></div>

      <div class="example" id="examplePanel" role="tabpanel">
        <div class="example-grid">
          <div class="example-main">
            <h1 class="example-title" id="exampleTitle"></h1>

            <div class="progress-track" id="progress" aria-hidden="true"></div>

            <div class="year-button-row">
              <p class="year" id="year"></p>
              <button type="button" class="action-btn" id="actionBtn" data-state="advance">
                <span class="btn-label btn-label--advance">Advance <span aria-hidden="true">&rarr;</span></span>
                <span class="btn-label btn-label--summary">Summary <span aria-hidden="true">&rarr;</span></span>
                <span class="btn-label btn-label--reset"><span aria-hidden="true">&#x21BA;</span> Reset</span>
              </button>
            </div>

            <div class="stat-grid">
              <div class="stat-card stat-card--accent">
                <div class="stat-label">Salary</div>
                <div class="stat-value" id="salary"></div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Extra</div>
                <div class="stat-value" id="extra"></div>
              </div>
            </div>

            <div class="summary-box" id="summaryBox" hidden>
              <p class="summary" id="summary"></p>
              <p class="subsummary" id="subsummary"></p>
            </div>
          </div>

          <div class="example-details">
            <ul class="details-log" id="detailsLog"></ul>
          </div>
        </div>
        <span class="sr-only" id="srOnly" role="status"></span>
      </div>
    </div>

    <script type="module">
      const YEARS = Object.freeze([ "2025", "2026", "2027", "2028", "2029", "2030" ]);
      const DATA = [
        {
          slug: "first",
          label: "First Example",
          title: "FT Academic hired in 2012",
          salary: [
            "$76,000",
            "$79,420",
            "$83,647",
            "$87,175",
            "$90,790",
            "$94,014"
          ],
          extra: [
            "$0",
            "$0",
            "$600",
            "$1,200",
            "$1,800",
            "$2,400"
          ],
          details: [
            "Starting salary in 2025: **$76,000** (the median UUP salary)",
            "4.5% ATB raise",
            "4.0% ATB raise + $450 DSI + $250 7yr retention award + $350 12yr retention award\n$600 higher ed differential (lump sum)",
            "3.5% ATB raise + $250 7yr retention award + $350 12yr retention award\n$600 higher ed differential (lump sum)",
            "3.0% ATB raise + $250 7yr retention award + $750 17yr retention award\n$600 higher ed differential (lump sum)",
            "3.0% ATB raise + $500 cost of living differential\n$600 higher ed differential (lump sum)"
          ],
          summary: "Over the **five** years of the agreement:\n**23.7%** increase to base salary, plus $2,400 lump sum payments.",
          subsummary: "*Not included:* additional DSIs (compounded), location&thinsp;/&thinsp;on-call&thinsp;/&thinsp;inconvenience pay, any IDA&thinsp;/&thinsp;Drescher&thinsp;/&thinsp;etc., statutory (not contractual) gains from Tier 6 fix, ….",
        },
      ];
      DATA.push(
        { ...DATA[0], slug: "second", label: "Second Example", title: "Same as the first example for now" },
        { ...DATA[0], slug: "third",  label: "Third Example",  title: "Same as the first example for now" },
        { ...DATA[0], slug: "fourth", label: "Fourth Example", title: "Same as the first example for now" },
        { ...DATA[0], slug: "fifth",  label: "Fifth Example",  title: "Same as the first example for now" },
      );

      // --beat may be given in ms or s, bare number = ms, 0 (e.g., via prefers-reduced-motion) is valid
      const rawBeat    = getComputedStyle(document.documentElement)
                           .getPropertyValue("--beat").trim();
      const parsedBeat = rawBeat.endsWith("ms") ? parseFloat(rawBeat)
                       : rawBeat.endsWith("s")  ? parseFloat(rawBeat) * 1000
                       : rawBeat !== "" && !Number.isNaN(Number(rawBeat)) ? Number(rawBeat)
                       : NaN;
      const BEAT       = Number.isNaN(parsedBeat) ? 350 : parsedBeat;

      const TIMING = Object.freeze({
        COUNT:   BEAT * 2,   // duration of number animation
        ENTER:   BEAT * 0.6, // delay before a new log row fades in
        SUMMARY: BEAT * 0.2, // delay before the summary box fades in
      });

      let tab              = 0;
      let stage            = 0;

      const elTabs         = document.getElementById("tabs");
      const tabEls         = []; // filled by buildTabs()
      const elPanel        = document.getElementById("examplePanel");
      const elTitle        = document.getElementById("exampleTitle");
      const elYear         = document.getElementById("year");
      const elSalary       = document.getElementById("salary");
      const elExtra        = document.getElementById("extra");
      const elLog          = document.getElementById("detailsLog");
      const elBtn          = document.getElementById("actionBtn");
      const elProgress     = document.getElementById("progress");
      let   elPips;       // assigned by buildPips()
      const elSummaryBox   = document.getElementById("summaryBox");
      const elSummary      = document.getElementById("summary");
      const elSubsummary   = document.getElementById("subsummary");
      const elSrOnly       = document.getElementById("srOnly");

      const parseCurrency  = str => parseInt(str.replace(/[$,]/g, ""), 10);
      const formatCurrency = n   => "$" + n.toLocaleString("en-US");
      const formatText     = str => str
                                      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                                      .replace(/\*([^*]+)\*/g,     "<em>$1</em>");
                          // this is safe because DATA is hand-made

      // number animation — adapted from codepen.io/duvander/pen/KXOpXw
      // count from the last tracked value → to, with a cubic ease-out
      const rafIds = new WeakMap();
      const values = new WeakMap();
      function animateNumber(element, to, formatter, animate) {
        const prev = rafIds.get(element);
        if (prev) { cancelAnimationFrame(prev); rafIds.delete(element); }

        const from = values.get(element);
        if (!animate || TIMING.COUNT <= 0 || from === undefined || from === to) {
          values.set(element, to);
          element.textContent = formatter(to);
          return;
        }

        const start = performance.now();
        function tick(now) {
          const progress = Math.min(Math.max((now - start) / TIMING.COUNT, 0), 1);
          const eased    = 1 - Math.pow(1 - progress, 3);
          const value    = Math.round(from + (to - from) * eased);
          values.set(element, value);
          element.textContent = formatter(value);
          if (progress < 1) rafIds.set(element, requestAnimationFrame(tick));
          else              rafIds.delete(element);
        }
        rafIds.set(element, requestAnimationFrame(tick));
      }

      function makeLogItem() {
        const li = document.createElement("li");
        li.classList.add("current");

        const label = document.createElement("span");
        label.className   = "log-year";
        label.textContent = YEARS[stage];

        const text  = document.createElement("span");
        text.className    = "log-text";
        text.innerHTML    = formatText(DATA[tab].details[stage]);

        li.append(label, text);
        return li;
      }

      function resetLog() {
        elLog.replaceChildren();
        const li = makeLogItem();
        elLog.appendChild(li);
        li.animate([{ opacity: 0 }, { opacity: 1 }], { duration: BEAT, easing: "ease" });
      }

      // prepend the new current row; slide the existing rows down (FLIP)
      function advanceLog() {
        const items = Array.from(elLog.children);
        items.forEach(el => el.getAnimations().forEach(a => a.finish()));
        const firstTops = items.map(el => el.getBoundingClientRect().top);

        const cur = elLog.querySelector("li.current");
        if (cur) cur.classList.remove("current");

        const li = makeLogItem();
        elLog.prepend(li);

        items.forEach((el, i) => {
          const delta = firstTops[i] - el.getBoundingClientRect().top;
          if (delta) {
            el.animate(
              [{ transform: `translateY(${delta}px)` }, { transform: "translateY(0)" }],
              { duration: BEAT, easing: "ease" }
            );
          }
        });

        li.animate(
          [{ opacity: 0, transform: "translateY(-8px)" }, { opacity: 1, transform: "translateY(0)" }],
          { duration: BEAT, delay: TIMING.ENTER, easing: "ease", fill: "backwards" }
        );
      }

      function showSummary() {
        const cur = elLog.querySelector("li.current");
        if (cur) cur.classList.remove("current");

        elSummary.   innerHTML = formatText(DATA[tab].summary);
        elSubsummary.innerHTML = formatText(DATA[tab].subsummary);
        elSummaryBox.hidden = false;
        elSummaryBox.animate(
          [{ opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "translateY(0)" }],
          { duration: BEAT, delay: TIMING.SUMMARY, easing: "ease", fill: "backwards" }
        );
      }

      function hideSummary() {
        elSummaryBox.hidden = true;
      }

      function render({ animateNumbers = false } = {}) {
        if (stage === 0) {
          elTitle.innerHTML = formatText(DATA[tab].title);
          resetLog();
          hideSummary();
        }
        if (stage < YEARS.length) { // stage 0 also matches here
          elYear.textContent = YEARS[stage];
          animateNumber(elSalary, parseCurrency(DATA[tab].salary[stage]), formatCurrency, animateNumbers);
          animateNumber(elExtra,  parseCurrency(DATA[tab].extra [stage]), formatCurrency, animateNumbers);
          if (stage > 0) advanceLog();
          elBtn.dataset.state  = stage < YEARS.length - 1 ? "advance" : "summary";
          elSrOnly.textContent = `${YEARS[stage]}: salary ${DATA[tab].salary[stage]}, extra ${DATA[tab].extra[stage]}`;
        } else { // last stage
          showSummary();
          elBtn.dataset.state  = "reset";
          elSrOnly.textContent = `${elSummary.textContent} ${elSubsummary.textContent}`;
        }

        elPips.forEach((pip, i) => pip.classList.toggle("filled", i < stage));
      }

      elBtn.addEventListener("click", () => {
        stage = (stage + 1) % (YEARS.length + 1);
        render({ animateNumbers: true });
      });

      function buildPips() {
        for (let i = 0; i < YEARS.length - 1; i++) {
          const pip = document.createElement("div");
          pip.className = "progress-pip";
          elProgress.appendChild(pip);
        }
        const summaryPip = document.createElement("div");
        summaryPip.className = "progress-pip progress-pip--summary";
        elProgress.appendChild(summaryPip);
        elPips = elProgress.querySelectorAll(".progress-pip");
      }

      function buildTabs() {
        DATA.forEach((d, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tab";
          btn.id = "tab-" + i;
          btn.textContent = d.label;
          btn.dataset.tab = i;
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-controls", "examplePanel");
          tabEls.push(btn);
          elTabs.appendChild(btn);
        });
      }

      function applyActiveTab(scrollBehavior = "auto") {
        tabEls.forEach((t, i) => {
          const active = i === tab;
          t.classList.toggle("is-active", active);
          t.setAttribute("aria-selected", String(active));
          t.tabIndex = active ? 0 : -1;
        });
        elPanel.setAttribute("aria-labelledby", "tab-" + tab);
        tabEls[tab].scrollIntoView({ inline: "nearest", block: "nearest", behavior: scrollBehavior });
      }

      function syncSlug() {
        const url = new URL(location.href);
        url.searchParams.set("s", DATA[tab].slug);
        history.replaceState(null, "", url);
      }

      function selectTab(idx) {
        if (idx === tab) return;
        tab = idx;
        stage = 0;
        applyActiveTab("smooth");
        render();
        syncSlug();
      }

      elTabs.addEventListener("click", e => {
        const btn = e.target.closest(".tab");
        if (btn) selectTab(Number(btn.dataset.tab));
      });

      elTabs.addEventListener("keydown", e => {
        let idx;
        if (e.key === "ArrowRight")     idx = (tab + 1) % DATA.length;
        else if (e.key === "ArrowLeft") idx = (tab - 1 + DATA.length) % DATA.length;
        else if (e.key === "Home")      idx = 0;
        else if (e.key === "End")       idx = DATA.length - 1;
        else return;

        e.preventDefault();
        selectTab(idx);
        tabEls[idx].focus({ preventScroll: true });
      });

      // resolve the initial tab from the URL, then normalize the URL
      const initSlug = new URLSearchParams(location.search).get("s");
      const initIdx  = DATA.findIndex(d => d.slug === initSlug);
      if (initIdx > 0) tab = initIdx;
      syncSlug();

      buildPips();
      buildTabs();
      applyActiveTab();
      render();

      let pressTimer;
      document.addEventListener("keydown", e => {
        if (e.key !== " " || e.repeat) return;
        if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
        e.preventDefault();
        clearTimeout(pressTimer);
        elBtn.classList.add("is-pressed");
        pressTimer = setTimeout(() => elBtn.classList.remove("is-pressed"), 100);
        elBtn.click();
      });
    </script>
  </body>
</html>
